name: Build And Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: Pages
  cancel-in-progress: false

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Website
        run: php Build.php

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_Site

  Deploy:
    environment:
      name: github-pages
      url: ${{ steps.Deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Deploy Website
        id: Deployment
        uses: actions/deploy-pages@v4
